
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: backend-1
              uri: http://localhost:8081
              predicates:
                - Path=/backend1/**
              filters:
                - StripPrefix=1

            - id: backend-2
              uri: http://localhost:8082
              predicates:
                - Path=/backend2/**
              filters:
                - StripPrefix=1

            - id: backend-3
              uri: http://localhost:8083
              predicates:
                - Path=/backend3/**
              filters:
                - StripPrefix=1

            - id: round-robin-demo
              uri: http://localhost:8081
              predicates:
                - Path=/roundrobin/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
